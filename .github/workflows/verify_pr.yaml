name: Verify Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        
      - name: Install dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore